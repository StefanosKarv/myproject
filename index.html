<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparison System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <style>
      body,
      html {
        height: 100%;
        background-color: #464549;
        margin: 0;
      }
      .container {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .content {
        flex: 1;
      }
      .header {
        background-color: #464549;
        color: #ffffff;
        padding: 20px 0;
        text-align: center;
      }
      .footer {
        background-color: #1d2e21;
        color: #fff;
        padding: 10px 0;
        text-align: center;
      }
      h1 {
        font-size: 3rem;
        color: #ffffff;
      }
      h2 {
        font-size: 2rem;
        color: #ffffff;
      }
      img {
        transition: transform 0.5s ease;
        max-width: 100%;
        height: auto;
      }
      img:hover {
        transform: scale(1.05);
      }
      .button-group {
        display: flex;
        justify-content: center;
        gap: 15px; /* Απόσταση μεταξύ των κουμπιών */
      }
      .button {
        background-color: #2b3e2f;
        border: none;
        color: white;
        padding: 20px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
      }
      .button1 {border-radius: 8px;}
      .btn-custom {
        background-color: #1d2e21;
        color: #fff;
        border: none;
      }
      .btn-custom:hover {
        background-color: #2b3e2f;
        color: #fff;
      }

      .dropbtn {
  background-color: #2b3e2f;
  color: rgb(255, 255, 255);
  padding: 16px;
  font-size: 16px;
  border: none;
  cursor: pointer;
}

.dropbtn:hover, .dropbtn:focus {
  background-color: #2b3e2f;
}

.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color: #0a4726;
  min-width: 160px;
  overflow: auto;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}

.dropdown-content a {
  color: rgb(255, 255, 255);
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown a:hover {background-color: #ddd;}

.show {display: block;}

    </style>
  </head>
  <body onload="document.body.style.opacity='1'">
    <div class="container d-flex flex-column">
      <header class="header">
        <h2>
          Department of Informatics and Telecommunications
          <br />
          University of Ioannina
        </h2>
        <div class="dropdown">
          <button onclick="myFunction()" class="dropbtn button1">Click to Compare</button>
          <div id="myDropdown" class="dropdown-content">
            <a href="compare_mobo.html">Motherboard</a>
            <a href="compare_cpu.html">CPU</a>
            <a href="compare_gpu.html">GPU</a>
          </div>
        </div>
      </header>
      <div class="content">
        <div class="text-center mt-5">
          <center>
            <h2>Karvounis Stefanos</h2>
            <h1>Comparison System</h1>
            <br />
            <img
              src="image.png"
              class="img-fluid rounded shadow-lg"
            />
            <br />
            <br />
            <h2>Supervising Prof.: Charilogis Vasileios</h2>
            <br />
          </center>
        </div>
      </div>
      <footer class="footer mt-auto">
        Development : Karvounis Stefanos (2024)
      </footer>
    </div>
    <script>
      /* When the user clicks on the button, 
      toggle between hiding and showing the dropdown content */
      function myFunction() {
        document.getElementById("myDropdown").classList.toggle("show");
      }
      
      // Close the dropdown if the user clicks outside of it
      window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
          var dropdowns = document.getElementsByClassName("dropdown-content");
          var i;
          for (i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
              openDropdown.classList.remove('show');
            }
          }
        }
      }
      </script>
    <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
